name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and tests
        run: python -m pip install -e . pytest
      - name: Run offline scientific tests
        run: python -m pytest -q
      - name: Run reference-data demo
        run: python demo/demo.py --no-plot
      - name: Verify finite-field construction
        run: python experiments/exact_construction/verify_family.py
